name: Build and run tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@248ae51c2e8cc9622ecf50685c8bf7150c6e8813  # v1.4.3
      with:
        # Using audit because some endpoints are not reliably fixed. We could
        # try to nail them down, but it would turn into a game of whack-a-mole.
        egress-policy: audit
        disable-telemetry: true
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # satisfies zizmor/unpinned-uses
    - name: set up JDK 21
      uses: actions/setup-java@6a0805fcefea3d4657a47ac4c165951e33482018 # satisfies zizmor/unpinned-uses
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build
      run: mvn package --file pom.xml -DskipTests
    - name: Test
      run: mvn test --file pom.xml -X
